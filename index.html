<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端视口：不允许用户缩放，用户需要选择合适的设备 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="蒂芙尼蓝主题舒尔特方格：经典方格、不规则、鹅卵石、蜂巢、圆环五种形态，支持 PC 与移动端 H5 的注意力训练工具" />
    <!--
      将WebApp添加到主屏幕后以全屏、无浏览器UI的方式运行，接近原生应用体验
      apple-mobile-web-app-capable：设为yes时，iOS Safari会将WebApp视为独立应用启动
      -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Android Chrome 全屏 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- status-bar-style：控制状态栏样式（default、black、black-translucent），需与页面背景协调 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 主题色 theme-color：Chrome、Edge等浏览器会将其用于地址栏背景色 主题色应与品牌主色一致，避免频繁更改 -->
    <meta name="theme-color" content="#0ABAB5" />
    <title>舒尔特方格 · 注意力训练</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <!-- iOS设备专用，建议尺寸为180x180 -->
    <link rel="apple-touch-icon" href="assets/favicon.png" />
    <!-- 独立样式目录：全部视觉样式集中于 css/style.css -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ================================================== -->
    <!-- 应用主容器：标题栏 / 统计条 / 方格画板 / 操作按钮     -->
    <!-- ================================================== -->
    <div class="app" id="app">
      <!-- ========== 顶部标题栏：品牌名 + 训练说明 ========== -->
      <header class="app-header">
        <h1 class="app-title">
          <span class="app-title__mark" aria-hidden="true"></span>
          舒尔特方格
        </h1>
        <p class="app-subtitle">从数字 <strong>1</strong> 开始，按从小到大的顺序依次点击</p>
      </header>

      <!-- ========== 实时统计条：用时 / 目标 / 连对 / 正确 / 错误 ========== -->
      <section class="stats-bar" aria-label="训练数据统计">
        <div class="stat-card stat-card--accent">
          <span class="stat-card__label">用时</span>
          <span class="stat-card__value"><span id="statTime">0.0</span><small>s</small></span>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">目标</span>
          <span class="stat-card__value"><span id="statTarget">1</span></span>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">连对</span>
          <span class="stat-card__value" id="statStreak">0</span>
        </div>
        <div class="stat-card stat-card--ok">
          <span class="stat-card__label">正确</span>
          <span class="stat-card__value" id="statCorrect">0</span>
        </div>
        <div class="stat-card stat-card--err">
          <span class="stat-card__label">错误</span>
          <span class="stat-card__value" id="statWrong">0</span>
        </div>
      </section>

      <!-- ========== 方格画板：五种形态均渲染到 #board（保持正方形） ========== -->
      <main class="board-stage">
        <div class="board-frame">
          <div id="board" class="board" aria-label="舒尔特方格画板"></div>
          <!-- 开始前的引导遮罩：首次点击数字后自动消失 -->
          <div class="board-hint" id="boardHint">点击数字 <b>1</b> 开始计时</div>
        </div>
      </main>

      <!-- ========== 底部操作区：模式选择 / 重新开始 ========== -->
      <footer class="actions">
        <button type="button" class="btn btn--ghost" id="btnOpenMode">模式选择</button>
        <button type="button" class="btn btn--primary" id="btnRestart">重新开始</button>
      </footer>
    </div>

    <!-- ================================================== -->
    <!-- 模式选择弹框：格子数量（4x4 ~ 9x9）+ 方格类型（5 种） -->
    <!-- ================================================== -->
    <div class="modal-mask" id="modeModal" hidden>
      <div class="modal modal--mode" role="dialog" aria-modal="true" aria-labelledby="modeTitle">
        <h2 class="modal__title" id="modeTitle">模式选择</h2>

        <!-- 选项组一：格子数量 -->
        <fieldset class="opt-group">
          <legend class="opt-group__label">格子数量</legend>
          <div class="opt-group__options" id="sizeOptions">
            <!-- 4×4 ~ 9×9 单选项由 js/ui.js 根据配置动态渲染 -->
          </div>
          <!-- 小屏设备（最小物理宽高 &lt; 600px）禁用 7×7 及以上时显示的提示 -->
          <p class="opt-group__tip" id="sizeTip" hidden>当前设备屏幕较小，格子数量最大支持 6×6</p>
        </fieldset>

        <!-- 选项组二：方格类型 -->
        <fieldset class="opt-group">
          <legend class="opt-group__label">方格类型</legend>
          <div class="opt-group__options" id="typeOptions">
            <!-- 经典方格 / 不规则 / 鹅卵石 / 蜂巢 / 圆环 由 js/ui.js 动态渲染 -->
          </div>
        </fieldset>

        <!-- 弹框底部操作按钮 -->
        <div class="modal__footer">
          <button type="button" class="btn btn--ghost btn--block" id="btnModeCancel">取消</button>
          <button type="button" class="btn btn--primary btn--block" id="btnModeConfirm">确定</button>
        </div>
      </div>
    </div>

    <!-- ================================================== -->
    <!-- 结果展示弹框：完成用时（整数秒）+ 成绩明细 + 再来一局  -->
    <!-- ================================================== -->
    <div class="modal-mask" id="resultModal" hidden>
      <div class="modal modal--result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <!-- 参考稿指定的鼓掌表情 -->
        <div class="result-clap" aria-hidden="true">&#128079;</div>
        <h2 class="modal__title" id="resultTitle">全部点击完成</h2>
        <p class="result-time">用时 <strong id="resultSeconds">0</strong> 秒</p>

        <!-- 成绩明细：总正确 / 总错误 / 最高连对 -->
        <dl class="result-grid">
          <div class="result-grid__item">
            <dt>总正确</dt>
            <dd id="resultCorrect" class="is-ok">0</dd>
          </div>
          <div class="result-grid__item">
            <dt>总错误</dt>
            <dd id="resultWrong" class="is-err">0</dd>
          </div>
          <div class="result-grid__item result-grid__item--full">
            <dt>最高连对</dt>
            <dd id="resultMaxStreak">0</dd>
          </div>
        </dl>

        <button type="button" class="btn btn--primary btn--block" id="btnPlayAgain">再来一局</button>
        <p class="result-tip">关闭弹框将自动按当前模式重新开始</p>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
